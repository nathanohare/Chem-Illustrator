name: Structure Reader Model

# Builds the model pack the structure reader (File > Import > From PDF, From Picture) downloads
# the first time it is used, and publishes it as the release "recognition-model-1" (a
# pre-release, so it is never "latest" and the updater passes over it). The pack: MolScribe
# (MIT licence) converted to ONNX by scripts/recognition/export.py, its vocabulary, and the
# WebAssembly part of the ONNX runtime the app runs it with (the version in package-lock.json).
# Runs when export.py changes on main, or by hand; a pull request that changes it builds the
# pack without publishing it. The app asks for PACK in
# src/recognise/pack.ts: change both together when the pack changes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/recognition/**, .github/workflows/recognition-model.yml]
  pull_request:
    paths: [scripts/recognition/**, .github/workflows/recognition-model.yml]

permissions:
  contents: write # to publish the pack

concurrency:
  group: recognition-model
  cancel-in-progress: false

env:
  PACK: recognition-model-1
  MOLSCRIBE: 7296a30413eb55436702011efdff78131f66d162
  CHECKPOINT: https://huggingface.co/yujieq/MolScribe/resolve/main/swin_base_char_aux_1m680k.pth
  CHECKPOINT_SHA256: 32821fa4ba8d17f9a92e374601438c5e757947dbf1141e9ad0ef51cccfa1c501

jobs:
  pack:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/recognition/requirements.txt
          pip install --no-deps "git+https://github.com/thomas0809/MolScribe.git@$MOLSCRIBE"
          npm ci --ignore-scripts
      - name: Get MolScribe's weights
        run: |
          curl -sSfL -o ckpt.pth "$CHECKPOINT"
          echo "$CHECKPOINT_SHA256  ckpt.pth" | sha256sum -c -
      - name: Convert
        run: |
          python scripts/recognition/export.py ckpt.pth pack
          rm -r pack/full
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm pack/
          curl -sSfL -o pack/MolScribe-LICENSE.txt "https://raw.githubusercontent.com/thomas0809/MolScribe/$MOLSCRIBE/LICENSE"
          node -e "
            const fs = require('fs'), crypto = require('crypto');
            const files = fs.readdirSync('pack').filter((f) => f !== 'manifest.json').map((name) => {
              const b = fs.readFileSync('pack/' + name);
              return { name, bytes: b.length, sha256: crypto.createHash('sha256').update(b).digest('hex') };
            });
            const ort = require('./node_modules/onnxruntime-web/package.json').version;
            fs.writeFileSync('pack/manifest.json', JSON.stringify({ pack: process.env.PACK, ort, files }, null, 1));
          "
          cat pack/manifest.json
      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          if ! gh release view "$PACK" --json tagName > /dev/null 2>&1; then
            gh release create "$PACK" --prerelease --latest=false --target "$GITHUB_SHA" --title "Structure reader model" \
              --notes "The model the structure reader downloads the first time it is used (MolScribe, MIT licence, converted to ONNX). Not an app release."
          fi
          gh release upload "$PACK" pack/* --clobber
