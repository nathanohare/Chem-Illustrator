name: Checks

on:
  push:
    branches: [main]
  pull_request:

# the token only reads the code (none of these steps writes to the repository)
permissions:
  contents: read

# A new push to a pull request (such as each merge into staging while the checkpoint pull request
# is open) stops the run still going for the old one
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
