name: Desktop code checks

# The desktop app's own code (src-tauri): its tests, on pull requests that change it.
# Pull requests that only change the web code skip this.

on:
  pull_request:
    paths: ['src-tauri/**', '.github/workflows/rust.yml']

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      # the app's pages are built into the program; the tests need only a page to be there
      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - run: cargo test --locked
        working-directory: src-tauri
